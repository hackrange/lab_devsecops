# The web desktop: the lab in a browser, at https://<this machine>:8446.
#
# Guacamole behind TLS.  The certificate is issued by this machine's lab CA for
# every address the machine has (hackrange-access cert keeps it current), so
# once a student trusts the lab CA there is no warning at all.
#
# Author: Tim Rice
server {
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($hackrange_host_ok = 0) { return 421; }   # no DNS rebinding (hackrange-hostcheck.conf)
    listen 8446 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/labtls/lab-access.crt;
    ssl_certificate_key /etc/nginx/labtls/lab-access.key;

    include /etc/nginx/hackrange-private-only.conf;

    # Nothing to see at the root: straight to the sign in page.
    location = / { return 302 /guacamole/; }

    # HackRange's icon in the browser tab.  Guacamole names its icon in its own
    # page, which an extension cannot change, so the two addresses it uses are
    # answered here with HackRange's instead.
    location = /guacamole/images/logo-64.png {
        alias /etc/nginx/hackrange-brand/favicon-64.png;
        default_type image/png;
    }
    location = /guacamole/images/logo-144.png {
        alias /etc/nginx/hackrange-brand/favicon-144.png;
        default_type image/png;
    }

    # The lab CA's public certificate, so a student can tell their own computer
    # to trust this lab (see the README).  Public by nature: no secret in it.
    location = /lab-ca.crt {
        alias /etc/nginx/labtls/lab-ca.crt;
        default_type application/x-x509-ca-cert;
    }

    # The control panel, from the student's own computer.  It asks for the lab
    # login here, because this door is open to the whole private network.
    location = /control { return 302 /control/; }
    location /control/ {
        proxy_pass http://unix:/run/hackrange/control.sock:/;
        proxy_set_header X-HR-Door remote;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /guacamole/ {
        proxy_pass http://127.0.0.1:18081/guacamole/;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_cookie_path /guacamole/ /guacamole/;
        # A desktop session is one long WebSocket.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        access_log off;
    }
}
