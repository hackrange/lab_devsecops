# The control panel, inside the lab: https://10.10.10.70:8447, the start page
# of the lab desktop's Firefox.
#
# Only the student's own lab session reaches it (hackrange-access, the network
# that session is on, is the one allowed range), and it trusts that: whoever is
# in the lab desktop has already signed in.  nginx says so with X-HR-Door,
# which it sets itself, overwriting anything a browser sent.  From the
# student's own computer the same panel is https://<machine>:8446/control/,
# which asks for the lab login (see hackrange-access.conf).
#
# Author: Tim Rice
server {
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($hackrange_host_ok = 0) { return 421; }   # no DNS rebinding (hackrange-hostcheck.conf)
    listen 10.10.10.70:8447 ssl;
    server_name 10.10.10.70;

    ssl_certificate     /etc/nginx/labtls/lab-services.crt;
    ssl_certificate_key /etc/nginx/labtls/lab-services.key;

    # The lab session's network, written by the installer (scripts/85-control.sh).
    include /etc/nginx/hackrange-lab-subnet.conf;
    # This machine itself: a local connection to 10.10.10.70 comes from
    # 10.10.10.70, and only this machine can have that address.
    allow 127.0.0.1;
    allow 10.10.10.70;
    deny all;

    location / {
        proxy_pass http://unix:/run/hackrange/control.sock;
        proxy_set_header X-HR-Door lab;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
