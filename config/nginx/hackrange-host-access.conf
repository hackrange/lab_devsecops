# The lab services, from the student's own computer.
#
# Inside the lab they are https://labgit.lab:8444, https://labrepo.lab:8443
# and https://10.10.10.70:8445 (hackrange-lab.conf), names and an address that
# exist only inside this VM.  These three servers put the same services on the
# VM's own network address, on the same ports, so a student can also open them
# in the browser on their own computer:
#
#   https://<VM address>:8444          the lab Git server
#   https://<VM address>:8443/admin/   the package registry's portal
#   https://<VM address>:8445          Git Code Review
#
# They answer private networks only, like every other way in, and use the web
# desktop's certificate, which names every address the VM has.  (nginx listens
# on the wildcard address here and on 10.10.10.70 in hackrange-lab.conf, and
# picks the server by the address a connection arrived on.)
#
# Author: Tim Rice

server {
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($hackrange_host_ok = 0) { return 421; }   # no DNS rebinding (hackrange-hostcheck.conf)
    listen 8444 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/labtls/lab-access.crt;
    ssl_certificate_key /etc/nginx/labtls/lab-access.key;
    include /etc/nginx/hackrange-private-only.conf;
    client_max_body_size 512m;
    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($hackrange_host_ok = 0) { return 421; }   # no DNS rebinding (hackrange-hostcheck.conf)
    listen 8443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/labtls/lab-access.crt;
    ssl_certificate_key /etc/nginx/labtls/lab-access.key;
    include /etc/nginx/hackrange-private-only.conf;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    location / {
        proxy_pass http://127.0.0.1:14444;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

server {
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($hackrange_host_ok = 0) { return 421; }   # no DNS rebinding (hackrange-hostcheck.conf)
    listen 8445 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/labtls/lab-access.crt;
    ssl_certificate_key /etc/nginx/labtls/lab-access.key;
    include /etc/nginx/hackrange-private-only.conf;
    client_max_body_size 128m;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
