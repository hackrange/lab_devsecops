# The lab services' front door, on the address the lessons use.
#
# The hosted course serves these from a lab node at 10.10.10.70.  A Local Lab
# gives this machine that same address on a private interface (see
# scripts/20-network.sh), so every URL, certificate and command in the lessons
# works unchanged.  Everything listens on that address only, never on the
# machine's real network.
#
# One certificate, signed by this machine's own lab CA, carries every name and
# the address, so a browser, git, npm, pip and containerd all verify it.
#
# Author: Tim Rice

# The lab Git server (Forgejo).  Pushes of a whole repository history and
# release uploads are larger than nginx's default body limit.
server {
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($hackrange_host_ok = 0) { return 421; }   # no DNS rebinding (hackrange-hostcheck.conf)
    listen 10.10.10.70:8444 ssl;
    server_name labgit.lab 10.10.10.70;

    ssl_certificate     /etc/nginx/labtls/lab-services.crt;
    ssl_certificate_key /etc/nginx/labtls/lab-services.key;

    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# The lab package registry (ForgeRepo).  It also proxies container images, and
# an image layer can be hundreds of megabytes, so there is no body limit and
# nothing is buffered to disk on the way through.
server {
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($hackrange_host_ok = 0) { return 421; }   # no DNS rebinding (hackrange-hostcheck.conf)
    listen 10.10.10.70:8443 ssl;
    server_name labrepo.lab 10.10.10.70;

    ssl_certificate     /etc/nginx/labtls/lab-services.crt;
    ssl_certificate_key /etc/nginx/labtls/lab-services.key;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:14444;
        # The registry writes this into every tarball and index link it hands
        # out, so it has to carry the port the client actually used.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

# The SAST and secrets platform (Git Code Review), on the address rather than a
# name, exactly as the lessons show it.
server {
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($hackrange_host_ok = 0) { return 421; }   # no DNS rebinding (hackrange-hostcheck.conf)
    listen 10.10.10.70:8445 ssl;
    server_name 10.10.10.70 labrepo.lab;

    ssl_certificate     /etc/nginx/labtls/lab-services.crt;
    ssl_certificate_key /etc/nginx/labtls/lab-services.key;

    # A scan report and an SBOM upload are both larger than the default.
    client_max_body_size 128m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # A first scan of a repository runs well past the default 60 seconds.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
