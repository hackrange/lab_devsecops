# Who may reach the ways into the lab: this machine, and computers on private
# networks (a home or office network, a virtual machine's NAT, a VPN such as
# Tailscale).  Never the internet.  A student who does not know better might
# forward these ports on their router; the connection then arrives from a
# public address and is refused here, whatever the password.
#
# Included by the web desktop (http) and by the SSH and Remote Desktop
# passthroughs (stream).
#
# Author: Tim Rice
allow 127.0.0.0/8;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow 100.64.0.0/10;
allow 169.254.0.0/16;
allow ::1;
allow fc00::/7;
allow fe80::/10;
deny  all;
