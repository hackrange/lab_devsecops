# TCP passthroughs, at the top level of nginx's configuration.
#
# - The student's Kubernetes API: lab-vcluster writes one file per cluster into
#   /etc/nginx/stream.d, as the hosted node does.
# - SSH (2222) and Remote Desktop (13389) into the lab session.  The session
#   itself listens on loopback only (12222 and 13390); nginx is the door, so
#   the private-networks-only rule applies to them as it does to the web.
#
# Author: Tim Rice
stream {
    include /etc/nginx/stream.d/*.conf;

    server {
        listen 2222;
        include /etc/nginx/hackrange-private-only.conf;
        proxy_pass 127.0.0.1:12222;
        proxy_timeout 7d;
    }

    server {
        listen 13389;
        include /etc/nginx/hackrange-private-only.conf;
        proxy_pass 127.0.0.1:13390;
        proxy_timeout 7d;
    }
}
