server {
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($hackrange_host_ok = 0) { return 421; }   # no DNS rebinding (hackrange-hostcheck.conf)
    listen 10.10.10.70:8449 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/labtls/lab-services.crt;
    ssl_certificate_key /etc/nginx/labtls/lab-services.key;
    # Kong Manager asks this file where the admin API is.  Answered here, so
    # the Manager in the lab desktop's browser talks to the lab's admin API.
    location = /kconfig.js {
        default_type application/javascript;
        return 200 "window.K_CONFIG = {\n  'ANONYMOUS_REPORTS': 'false',\n  'ADMIN_GUI_PATH': '/',\n  'ADMIN_API_URL': 'https://10.10.10.70:8450',\n  'ADMIN_API_PORT': '8450',\n  'ADMIN_API_SSL_PORT': '8450'\n}\n";
    }
    location / {
        proxy_pass http://127.0.0.1:18449;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_read_timeout 600s;
    }
}

