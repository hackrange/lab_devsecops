# The Week 4 services: Keycloak, Kong and Grafana (with Loki and Tempo).
#
# Each is served on the lab address (inside the lab) and, where it has a login
# of its own, on the machine's own address for the student's computer (private
# networks only, like every other way in):
#
#   8448  Keycloak's admin console      inside and outside
#   8449  Kong Manager                  inside the lab only
#   8450  Kong's admin API              inside the lab only
#   8451  Kong's gateway (the proxy)    inside and outside
#   8452  Grafana                       inside and outside
#
# Kong Manager and Kong's admin API have no login in Kong's free edition:
# anyone who reached them could reconfigure the gateway.  So they are only on
# the lab address, where the student is the only one.
#
# Author: Tim Rice

server {
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($hackrange_host_ok = 0) { return 421; }   # no DNS rebinding (hackrange-hostcheck.conf)
    listen 10.10.10.70:8448 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/labtls/lab-services.crt;
    ssl_certificate_key /etc/nginx/labtls/lab-services.key;
    location / {
        proxy_pass http://127.0.0.1:18448;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_read_timeout 600s;
    }
}

