# .github/workflows/deploy.yml from the (fictional) invoice-service team.
# Every value below is a fake, non-functional lab marker.
name: deploy
on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIALABFAKE000000001
      AWS_SECRET_ACCESS_KEY: LAB_SECRET_AWSSECRETKEY00001
    steps:
      - uses: actions/checkout@v4

      - name: Debug the connection
        run: |
          echo "Deploying with token ${{ secrets.DEPLOY_TOKEN }}"
          echo "${{ secrets.DEPLOY_TOKEN }}" | base64 > token.b64

      - name: Keep the debug output
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: token.b64
